<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 空状态：没有记录 -->
  <ellipse cx="100" cy="170" rx="55" ry="6" fill="#F5F0EB"/>
  <!-- 剪贴板 -->
  <rect x="65" y="45" width="70" height="90" rx="8" stroke="#B35D3A" stroke-width="2.5" fill="none" opacity="0.6"/>
  <!-- 剪贴板顶部夹子 -->
  <rect x="82" y="38" width="36" height="14" rx="4" stroke="#B35D3A" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- 横线（空内容） -->
  <line x1="80" y1="75" x2="120" y2="75" stroke="#E8E2DC" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="90" x2="115" y2="90" stroke="#E8E2DC" stroke-width="2" stroke-linecap="round"/>
  <line x1="80" y1="105" x2="108" y2="105" stroke="#E8E2DC" stroke-width="2" stroke-linecap="round"/>
  <!-- 爪印 -->
  <circle cx="45" cy="130" r="6" fill="#F5EDE8"/>
  <circle cx="38" cy="118" r="4" fill="#F5EDE8"/>
  <circle cx="50" cy="116" r="4" fill="#F5EDE8"/>
  <circle cx="53" cy="126" r="4" fill="#F5EDE8"/>
  <!-- 加号 -->
  <line x1="150" y1="70" x2="150" y2="90" stroke="#B35D3A" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="140" y1="80" x2="160" y2="80" stroke="#B35D3A" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
</svg>
