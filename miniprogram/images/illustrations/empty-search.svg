<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 空状态：没有搜索结果 -->
  <ellipse cx="100" cy="170" rx="55" ry="6" fill="#F5F0EB"/>
  <!-- 放大镜 -->
  <circle cx="90" cy="85" r="30" stroke="#B35D3A" stroke-width="2.5" fill="none" opacity="0.5"/>
  <line x1="112" y1="107" x2="140" y2="135" stroke="#B35D3A" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <!-- 搜索结果横线（虚线表示无结果） -->
  <line x1="72" y1="78" x2="108" y2="78" stroke="#E8E2DC" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="78" y1="88" x2="102" y2="88" stroke="#E8E2DC" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <line x1="75" y1="98" x2="105" y2="98" stroke="#E8E2DC" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  <!-- 爪印 -->
  <circle cx="150" cy="55" r="5" fill="#F5EDE8"/>
  <circle cx="144" cy="44" r="3.5" fill="#F5EDE8"/>
  <circle cx="155" cy="42" r="3.5" fill="#F5EDE8"/>
  <circle cx="158" cy="51" r="3.5" fill="#F5EDE8"/>
</svg>
