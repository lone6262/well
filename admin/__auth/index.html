<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>认证中...</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .box { text-align: center; padding: 40px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top-color: #B35D3A; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { color: #666; font-size: 14px; }
    .err { color: #c00; font-size: 14px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <div class="msg" id="msg">正在认证，请稍候...</div>
    <div class="err" id="err"></div>
  </div>

  <!-- 与主站使用同一个 SDK 文件，确保版本一致 -->
  <script src="../lib/cloudbase.js"></script>
  <script>
    (function() {
      const msgEl = document.getElementById('msg');
      const errEl = document.getElementById('err');

      function showError(text) {
        msgEl.textContent = '认证失败';
        errEl.textContent = text;
        console.error('[__auth] 认证失败:', text);
      }

      // 解析 URL 参数
      function getParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
      }

      const envId = getParam('env_id') || getParam('envId');
      const redirectUri = getParam('redirect_uri') || getParam('redirectUri');

      if (!envId) {
        showError('缺少环境ID参数');
        return;
      }

      // 初始化 CloudBase
      let app;
      try {
        app = cloudbase.init({ env: envId });
      } catch (e) {
        showError('SDK 初始化失败: ' + e.message);
        return;
      }

      const auth = app.auth({ persistence: 'local' });

      // 新版 SDK 使用 signInAnonymously()，旧版使用 anonymousAuthProvider().signIn()
      // 这里优先尝试新版 API，兼容两种写法
      function doAnonymousSignIn() {
        if (typeof auth.signInAnonymously === 'function') {
          return auth.signInAnonymously();
        }
        // 兼容旧版
        if (typeof auth.anonymousAuthProvider === 'function') {
          return auth.anonymousAuthProvider().signIn();
        }
        return Promise.reject(new Error('当前 SDK 不支持匿名登录'));
      }

      doAnonymousSignIn()
        .then(function() {
          msgEl.textContent = '认证成功，正在跳转...';
          // 跳回原始页面
          if (redirectUri) {
            window.location.href = decodeURIComponent(redirectUri);
          } else {
            window.location.href = '../index.html';
          }
        })
        .catch(function(err) {
          showError((err && err.message) || '匿名登录失败');
        });
    })();
  </script>
</body>
</html>
